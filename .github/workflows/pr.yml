name: PR Check

on:
  - pull_request

jobs:
  checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: ./mcp-db-analyzer

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      